<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DSE visual harness</title>
<link rel="stylesheet" href="vars.css">
<link rel="stylesheet" href="dist/harness.css">
<style>
/* deterministic shots */
*, *::before, *::after { transition: none !important; animation: none !important; }

/* SC-132 candidate boards — harness chrome only (captions/rules around the mounted
   elements). Deliberately OUTSIDE the plugin's class namespace and only ever present
   on `?board=1` pages, so it cannot influence any swept or frozen shot. */
#mount:has(.dse-cand-head) { padding: 22px 26px 26px; }
.dse-cand-head { margin-bottom: 20px; }
.dse-cand-title { font: 600 17px/1.3 ui-sans-serif, system-ui, sans-serif; letter-spacing: .01em; }
.dse-cand-sub { font: 400 12px/1.4 ui-sans-serif, system-ui, sans-serif; opacity: .55; margin-top: 3px; text-transform: uppercase; letter-spacing: .09em; }
.dse-cand-row { margin-bottom: 22px; }
.dse-cand-cap { font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; opacity: .45; margin-bottom: 7px; padding-bottom: 5px; border-bottom: 1px dashed currentColor; }
body.theme-dark #mount:has(.dse-cand-head) { color: #dce2e6; }
body.theme-light #mount:has(.dse-cand-head) { color: #22272b; }
</style>
</head>
<body class="theme-dark">
<div id="mount"></div>
<script src="dist/harness.js"></script>
</body>
</html>
