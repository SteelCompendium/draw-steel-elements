name: Plugin CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines requires >=22.15; 24 also gives jest native TS-config loading.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate (F3 OD-6): flipped once `npm run tsc` went green (D1, Vue removal
      # complete) — was informational-only (continue-on-error: true) while TS-1
      # (failing type-check) was outstanding.
      - name: Type check
        run: npm run tsc

      # Hard gate (SC-136 / FOLLOWUPS #61): SC-131 added the `lint` script but left it
      # unwired because the flat config had drifted, reporting 6 pre-existing problems
      # in 5 files. Those are now cleared (plus a small amount of further drift the
      # SC-132 stamina redesign added in the interim), so `npm run lint` is clean and
      # can gate for real. `eslint src main.ts` only — NOT `eslint .`, which crashes on
      # package.json/manifest.json (obsidianmd's typed rules need a tsconfig project).
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Bundle must build
        run: npm run build-no-check

      # ── Steel parity gate (SC-109 / FOLLOWUPS #36) ─────────────────────────────────
      # Half of the anti-drift mechanism (the jest material contract,
      # test/dom/theme/steelMaterial.test.ts) already ran under "Test". This is the other
      # half: the computed-style diff of the plugin's Steel theme against the live v2
      # site. It used to run only when a human remembered to — and human discipline is
      # exactly what failed before (plan 19 shipped a wholly flat Steel theme and PASSED
      # human review).
      #
      # `npm run parity` is OFFLINE. It builds the harness bundle, renders it from a
      # file:// URL with Playwright, and diffs against the COMMITTED baseline at
      # visual-harness/parity/baseline/site-inventory.json. No step in that chain
      # (esbuild.mjs -> plugin-capture.mjs -> diff.mjs -> compare.cjs) contains a URL.
      #
      # FAILURE POLICY — the baseline is NEVER refreshed here. `npm run parity:site` is
      # the only script that touches the live site, and it is a deliberate human action:
      # letting CI regenerate the reference of record would silently re-point the
      # contract at whatever the site happens to look like today, which is the one thing
      # this gate exists to prevent. A baseline that no longer covers the contract
      # therefore FAILS the build with an explicit "STALE BASELINE" message naming
      # `npm run parity:site` as the fix (compare.cjs `checkBaselineCoverage`).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # Keyed on the lockfile: a playwright version bump needs a fresh download,
          # anything else reuses it and keeps this step to a few seconds.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Chromium only — the harness never launches firefox/webkit. `--with-deps` adds the
      # shared libraries the runner image does not guarantee; it is a no-op apt run when
      # they are already present, and the browser download itself is skipped on a cache hit.
      - name: Install Chromium for the parity harness
        run: npx playwright install --with-deps chromium

      # No WARN special-casing: since SC-110 the contract is
      #   exit 0  <=>  0 GAPs AND 0 undeclared WARNs
      # so the exit code is the whole story. A finding is excused only by an explicit
      # `declaredDeferrals` entry in selector-map.json citing its FOLLOWUPS/ticket number,
      # which prints as DECLARED and is itself validated (and fails if it goes stale).
      # diff.mjs echoes the full report to stdout, so a failure is readable in the log.
      - name: Steel parity (plugin vs the committed v2 site baseline)
        run: npm run parity

  # ── Real-Obsidian e2e gate (SC-434, SC-408) ──────────────────────────────────────
  # SC-408 made a green FULL `npm run e2e` the required gate for landing any change to
  # this plugin, but until now it only ran on a developer's machine. This job runs it on
  # every push to main/develop and every pull_request, in parallel with `test`.
  #
  # FULL run, no `--only` / `--element`: that is what switches the coverage gate on (a
  # manifest control x interaction pair driven by zero tests, or only by known-bug tests,
  # fails the job). Expect `OBSIDIAN-E2E done: N/M ok, 0 failed, K known-bug, coverage: Y/Y
  # pairs`; the exact numbers live in the dse-verify skill, not here.
  #
  # NO RETRIES (SC-408: "a flake is a bug in the test or the product"). No retry wrapper, no
  # continue-on-error, no wdio specFileRetries: a red run stays red until its bundle is read.
  #
  # Pinned to ubuntu-24.04, not ubuntu-latest: GitHub is moving `ubuntu-latest` to Ubuntu 26.04
  # (announced for November 2026, a gradual 1-2 month migration), and a runner image that
  # changes under a real-Electron suite turns a green develop red with no code change. Bump
  # this deliberately, after a trial run.
  e2e:
    runs-on: ubuntu-24.04
    # Nothing here needs more than a read-only token (checkout), and the job runs PR-controlled
    # code (npm lifecycle scripts, the specs): say so, instead of inheriting whatever the
    # repository's default workflow permission is set to.
    permissions:
      contents: read
    # A new push to a pull request supersedes the run in progress (results for a stale commit
    # are noise). Pushes to develop/main must never be cancelled or dropped: with
    # cancel-in-progress off, GitHub still discards all but one PENDING run per group, so a
    # push gets its own group (the run id) and the group only ever coalesces pull_request runs.
    concurrency:
      group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # A full run is roughly 6-12 min on 4 cores (simulated locally; the first real runs are
    # the real measurement). 30 leaves room for a cold Obsidian download and a slow runner
    # without letting a hung Obsidian hold a runner for the 6 h default. The e2e step has its
    # own, shorter timeout (below) so that a hang still reaches the artifact upload.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same as the `test` job and the devbox pin (devbox.json: nodejs@24).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Obsidian version is pinned in exactly one place: `const PINNED` in e2e/run.mjs.
      # Read it from there so a version bump busts the cache below by itself, rather than
      # keeping a second copy of the number here that someone must remember to change.
      # OBSIDIAN_CACHE is where run.mjs / wdio-obsidian-service keep the downloads; setting
      # it explicitly (it is also run.mjs's default location) makes the cache step and the
      # runner agree on one path.
      #
      # The obsidian-launcher version (read from the installed package, not hard-coded) goes
      # into the cache key too: a launcher upgrade that changes the on-disk layout must not
      # restore the old tree on an exact hit. It changes only on a launcher bump, not on every
      # lockfile change.
      - name: Resolve pinned Obsidian version and cache dir
        id: pin
        run: |
          pin="$(sed -n "s/^const PINNED = '\([0-9][0-9.]*\)';.*/\1/p" e2e/run.mjs)"
          if [ -z "$pin" ]; then
            echo "::error file=e2e/run.mjs::could not read the PINNED Obsidian version"
            exit 1
          fi
          launcher="$(node -p "JSON.parse(require('fs').readFileSync('node_modules/obsidian-launcher/package.json','utf8')).version")"
          if [ -z "$launcher" ]; then
            echo "::error::could not read the obsidian-launcher version"
            exit 1
          fi
          echo "version=$pin" >> "$GITHUB_OUTPUT"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
          echo "OBSIDIAN_CACHE=$HOME/.cache/dse-e2e-obsidian" >> "$GITHUB_ENV"

      # ~530 MB on disk (Obsidian app + installer + a chromedriver), so a cache hit saves that
      # download on every run. Restore and save are separate steps so the cache is also saved
      # when the e2e step FAILS (the default post-job save only runs on success, and a red
      # run would then re-download on the next one). Keys are immutable: a hit is never
      # overwritten, a new pin makes a new key.
      - name: Restore Obsidian download cache
        id: obsidian-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OBSIDIAN_CACHE }}
          key: dse-e2e-obsidian-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}-launcher-${{ steps.pin.outputs.launcher }}

      # `npm run e2e` builds main.js itself (it runs `build-no-check` first), so there is no
      # separate build step. It also starts its own private Xvfb (xvfb is preinstalled on the
      # ubuntu-24.04 image) and sets DISPLAY for every child, so DISPLAY is deliberately not
      # set here.
      #
      # No apt step: every shared library the pinned Obsidian links against (gtk3, nss,
      # asound, gbm, ...) is in google-chrome-stable's dependency closure, and the image ships
      # Chrome. No sandbox workaround either: wdio-obsidian-service launches Obsidian with
      # --no-sandbox on Linux, so Ubuntu 24.04's AppArmor restriction on unprivileged user
      # namespaces never comes into play.
      #
      # No GITHUB_TOKEN: the GitHub API is only reached when obsidian-launcher *collects*
      # version metadata (`updateVersions`), never on this path. The app and installer come
      # from github.com release assets, the version list from raw.githubusercontent.com.
      #
      # --shards=4: one Obsidian per shard on the 4 vCPU / 16 GB standard runner that public
      # repositories get. run.mjs's own default, min(4, floor(nproc/3)), would pick 1 here;
      # 4 shards were measurably faster than 2 in the local 4-core simulation.
      #
      # timeout-minutes on the STEP, below the job's 30: when the job timeout fires GitHub
      # cancels the job, and the upload step below would then see a cancellation rather than a
      # failure. A step timeout kills the step and marks it failed, so the bundles of whatever
      # had failed by then still get uploaded.
      - name: End-to-end tests (real Obsidian)
        id: e2e
        timeout-minutes: 25
        run: npm run e2e -- --shards=4

      # Save the cache only if the download is COMPLETE. A red run can stop after the cache dir
      # was created but before every download finished, and actions/cache would save that
      # partial dir under the immutable key: every later run would then hit it, skip the save,
      # and re-download the missing pieces forever. Linux x64 layout (change it if this job
      # ever moves to arm):
      #   obsidian-installer/linux-x64/Obsidian-<v>/obsidian
      #   obsidian-app/obsidian-<v>.asar
      #   electron-chromedriver/linux-x64/<electron version>/chromedriver
      - name: Check the Obsidian download is complete
        id: obsidian-complete
        if: ${{ !cancelled() && steps.obsidian-cache.outputs.cache-hit != 'true' }}
        env:
          OBSIDIAN_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          c="$OBSIDIAN_CACHE"
          v="$OBSIDIAN_VERSION"
          if [ -x "$c/obsidian-installer/linux-x64/Obsidian-$v/obsidian" ] \
             && [ -f "$c/obsidian-app/obsidian-$v.asar" ] \
             && compgen -G "$c/electron-chromedriver/linux-x64/*/chromedriver" > /dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Obsidian download cache is incomplete; not saving it"
          fi

      - name: Save Obsidian download cache
        if: ${{ !cancelled() && steps.obsidian-complete.outputs.complete == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OBSIDIAN_CACHE }}
          key: dse-e2e-obsidian-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}-launcher-${{ steps.pin.outputs.launcher }}

      # A failing test leaves a bundle in e2e/.out/<run>/<test-id>/ (screenshot, DOM, note
      # before/after + diff, page events, vault copy). `.out` is a dot-directory, which
      # upload-artifact skips unless include-hidden-files is set. The name carries the run
      # attempt: a manual "Re-run" of the same run would otherwise collide on the name, and
      # upload-artifact v4 artifacts are immutable. Also runs when the job is cancelled (a
      # superseded pull_request run, or the job timeout), so a partial run still leaves what it
      # had.
      - name: Upload failure bundles
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out-${{ github.run_attempt }}
          path: e2e/.out/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
