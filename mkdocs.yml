site_name: "Steel Compendium: Draw Steel Elements Obsidian Plugin"
site_url: https://steelCompendium.io

copyright: The Draw Steel Compendium is an independent product published under the DRAW STEEL Creator License and is not affiliated with MCDM Productions, LLC. DRAW STEEL © 2024 MCDM Productions, LLC.

theme:
    name: 'material'
    custom_dir: overrides
    font:
        text: 'Source Serif 4'
    palette:
        scheme: slate
        primary: black
        accent: blue
    logo: Media/favicon.ico
    favicon: Media/favicon.ico

# SC-169: `docs/` is BOTH the published mkdocs source and — per the workspace CLAUDE.md
# routing table — the home of per-effort plans/specs (`docs/superpowers/`). Those are
# internal engineering documents, not user documentation, and with no explicit `nav:` this
# site builds its navigation from the directory tree, so an unexcluded spec would show up
# as a top-level section on steelcompendium.io. Excluded from the build instead of being
# routed somewhere else, so the workspace convention still resolves.
exclude_docs: |
    superpowers/

markdown_extensions:
    - footnotes
    -  pymdownx.arithmatex:
           generic: true
    -  pymdownx.tasklist:
           custom_checkbox: true
    - def_list
    - pymdownx.critic
    - pymdownx.caret
    - pymdownx.keys
    - pymdownx.mark
    - pymdownx.tilde
    -  pymdownx.superfences:
           custom_fences:
               -  name: mermaid
                  class: mermaid
                  format: !!python/name:pymdownx.superfences.fence_code_format

    -  toc:
           permalink: true
           toc_depth: 1-6

plugins:
    - search
    - roamlinks

extra:
    homepage: https://steelcompendium.io
    # SC-164: mike-versioned docs — main pushes deploy the released version under the
    # `latest` alias, develop pushes deploy `dev`. This turns on Material's built-in
    # version selector (reads gh-pages' mike-managed versions.json) and the "outdated
    # version" banner machinery (see overrides/main.html's `outdated` block override —
    # Material's own mechanism, not a custom one) that tells a `dev` reader they're not
    # looking at the released docs.
    version:
        provider: mike

extra_css:
    - stylesheets/extra.css

extra_javascript:
    - javascripts/mathjax.js
    - https://polyfill.io/v3/polyfill.min.js?features=es6
    - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    - https://unpkg.com/mermaid/dist/mermaid.min.js
    - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
    - javascripts/tablesort.js
