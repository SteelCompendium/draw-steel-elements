# SC-390 — the CORPUS-SHAPED BEASTHEART COMPANION statblock.
#
# Why it exists: companions used to ship as `type: feature-group` (a markdown table, no
# ds-* block) and rendered as "has no renderer". steel-etl now emits them as
# `type: statblock` with a real ds-sb block, and three things on the card are new for the
# plugin: TEXT stats (`stamina: = yours`, `free_strike: 1 + M` — printed verbatim, never
# coerced to a number), a `skills` list (the Skills cell in the 4th meta slot), and an EMPTY
# `ev` (the EV chip is omitted, not printed as a dangling "EV "). No other fixture renders
# any of them, so none of them could be seen by a camera or a freeze line.
#
