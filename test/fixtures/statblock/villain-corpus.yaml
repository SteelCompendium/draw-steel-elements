# SC-102 fix round (task-3 review M-1) — the CORPUS-SHAPED villain statblock.
#
# Every other villain fixture in this repo (src/elements/statblock/example.yaml,
# human-bandit-chief.yaml, the SettingsPreview embed) writes `ability_type: Villain
# Action N` — a HAND-AUTHORED shape steel-etl never emits. The pipeline emits
# `cost: Villain Action N` + the lone-dash `usage: '-'` + `icon: ☠️` and NO
# ability_type at all; the site's own classifier keys off exactly that cost prefix
# (statblock_page.go sbActionKind / featureblock_page.go fbFeatureAction). Shape is
# verbatim from
# data-unified/en/books/monsters/md-dse/monster/human/statblock/human-bandit-chief.md.
#
# A SEPARATE fixture, deliberately NOT an edit to the existing statblock fixtures:
# adding an ability to those would change the FROZEN statblock--legacy-{dark,light}.png.
